<mat-card class="content-margin">
  <mat-card-content>
    <mat-tab-group mat-stretch-tabs="true" mat-align-tabs="start">
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="example-tab-icon">restaurant</mat-icon>
          Restos
        </ng-template>
        <app-resto-details></app-resto-details>
      </mat-tab>
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon>food</mat-icon>
          Donars
        </ng-template>
        <app-donar-details></app-donar-details>
      </mat-tab>
      <mat-tab label="others"> </mat-tab>
    </mat-tab-group>
  </mat-card-content>
</mat-card>
